<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>{{ app_name }} — Submission received</title>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
  <main class="mx-auto flex min-h-screen max-w-lg items-center px-5 py-10">
    <section class="w-full rounded-2xl border border-slate-200 bg-white p-8 text-center shadow-sm">
      <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-emerald-100 text-emerald-700" aria-hidden="true">✓</div>
      <h1 class="mt-5 text-2xl font-semibold">Submission received</h1>
      <p class="mt-3 text-sm leading-6 text-slate-600">
        Your information has been submitted. Thank you.
      </p>
      <p class="mt-6 text-xs text-slate-500">{{ app_name }}</p>
    </section>
  </main>
</body>
</html>
